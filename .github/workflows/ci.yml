name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Ciemes
        uses: actions/checkout@v7
        with:
          path: ciemes
          persist-credentials: false
      - name: Check out WebAnvil
        uses: actions/checkout@v7
        with:
          repository: mzpkdev/webanvil
          path: webanvil
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ciemes/.nvmrc
          cache: npm
          cache-dependency-path: |
            ciemes/package-lock.json
            webanvil/package-lock.json
      - name: Install WebAnvil
        run: npm ci
        working-directory: webanvil
      - name: Install Ciemes
        run: npm ci
        working-directory: ciemes
      - name: Format
        run: npm run format
        working-directory: ciemes
      - name: Check formatting diff
        run: git diff --exit-code
        working-directory: ciemes

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Ciemes
        uses: actions/checkout@v7
        with:
          path: ciemes
          persist-credentials: false
      - name: Check out WebAnvil
        uses: actions/checkout@v7
        with:
          repository: mzpkdev/webanvil
          path: webanvil
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ciemes/.nvmrc
          cache: npm
          cache-dependency-path: |
            ciemes/package-lock.json
            webanvil/package-lock.json
      - name: Install WebAnvil
        run: npm ci
        working-directory: webanvil
      - name: Install Ciemes
        run: npm ci
        working-directory: ciemes
      - name: Typecheck
        run: npm run typecheck
        working-directory: ciemes

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Ciemes
        uses: actions/checkout@v7
        with:
          path: ciemes
          persist-credentials: false
      - name: Check out WebAnvil
        uses: actions/checkout@v7
        with:
          repository: mzpkdev/webanvil
          path: webanvil
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ciemes/.nvmrc
          cache: npm
          cache-dependency-path: |
            ciemes/package-lock.json
            webanvil/package-lock.json
      - name: Install WebAnvil
        run: npm ci
        working-directory: webanvil
      - name: Install Ciemes
        run: npm ci
        working-directory: ciemes
      - name: Lint
        run: npm run lint
        working-directory: ciemes

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Ciemes
        uses: actions/checkout@v7
        with:
          path: ciemes
          persist-credentials: false
      - name: Check out WebAnvil
        uses: actions/checkout@v7
        with:
          repository: mzpkdev/webanvil
          path: webanvil
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ciemes/.nvmrc
          cache: npm
          cache-dependency-path: |
            ciemes/package-lock.json
            webanvil/package-lock.json
      - name: Install WebAnvil
        run: npm ci
        working-directory: webanvil
      - name: Install Ciemes
        run: npm ci
        working-directory: ciemes
      - name: Test
        run: npm test
        working-directory: ciemes

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Ciemes
        uses: actions/checkout@v7
        with:
          path: ciemes
          persist-credentials: false
      - name: Check out WebAnvil
        uses: actions/checkout@v7
        with:
          repository: mzpkdev/webanvil
          path: webanvil
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ciemes/.nvmrc
          cache: npm
          cache-dependency-path: |
            ciemes/package-lock.json
            webanvil/package-lock.json
      - name: Install WebAnvil
        run: npm ci
        working-directory: webanvil
      - name: Install Ciemes
        run: npm ci
        working-directory: ciemes
      - name: Coverage
        run: npm run coverage
        working-directory: ciemes

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Ciemes
        uses: actions/checkout@v7
        with:
          path: ciemes
          persist-credentials: false
      - name: Check out WebAnvil
        uses: actions/checkout@v7
        with:
          repository: mzpkdev/webanvil
          path: webanvil
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ciemes/.nvmrc
          cache: npm
          cache-dependency-path: |
            ciemes/package-lock.json
            webanvil/package-lock.json
      - name: Install WebAnvil
        run: npm ci
        working-directory: webanvil
      - name: Install Ciemes
        run: npm ci
        working-directory: ciemes
      - name: Build
        run: npm run build
        working-directory: ciemes
